name: Build wheels and publish

# Builds portable binary wheels (with the compiled Cython kernel) for every
# supported platform/Python via cibuildwheel, plus an sdist, and publishes them
# to PyPI on a version tag. Source installs without a compiler still work via the
# pure-Python fallback.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate VERSION.txt
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "${GITHUB_REF##*/}" | sed 's/^v//' > VERSION.txt
          else
            echo "0.0.0.dev0" > VERSION.txt
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          # CPython 3.9-3.13, 64-bit; skip the slow/rare targets
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *_i686 *_ppc64le *_s390x pp*"
          CIBW_ARCHS_MACOS: "auto"

      # Verify each wheel shipped the compiled kernel by inspecting its contents
      # instead of importing mlquantify. Importing would reinstall the full
      # runtime stack, and the latest scipy/scikit-learn no longer ship
      # manylinux2014 wheels, so that install tries to build scipy from source
      # and fails (no OpenBLAS in the build container).
      - name: Verify compiled kernel is in each wheel
        shell: bash
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("wheelhouse/*.whl")
          assert wheels, "no wheels were built"
          missing = [
              w for w in wheels
              if not any(
                  "_histogram_sweep" in n and n.endswith((".so", ".pyd"))
                  for n in zipfile.ZipFile(w).namelist()
              )
          ]
          if missing:
              print("compiled histogram-sweep kernel missing from:")
              print(*("  " + w for w in missing), sep="\n")
              sys.exit(1)
          print(f"OK: compiled kernel present in all {len(wheels)} wheel(s)")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate VERSION.txt
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "${GITHUB_REF##*/}" | sed 's/^v//' > VERSION.txt
          else
            echo "0.0.0.dev0" > VERSION.txt
          fi
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
