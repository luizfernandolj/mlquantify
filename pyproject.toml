[build-system]
requires = ["setuptools>=77", "Cython>=3.0", "numpy>=1.23"]
build-backend = "setuptools.build_meta"

[project]
name = "mlquantify"
dynamic = ["version"]
description = "A Python package for quantification (supervised class-prevalence estimation)"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Luiz Fernando Luth Junior", email = "luizfernandoluth@gmail.com" },
    { name = "André Gustavo Maletzke" },
]
maintainers = [
    { name = "Luiz Fernando Luth Junior", email = "luizfernandoluth@gmail.com" },
]
keywords = ["python", "machine learning", "quantification", "quantify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "scikit-learn>=1.1",
    "numpy>=1.23",
    "scipy>=1.8",
    "joblib>=1.1",
    "tqdm>=4.60",
    "pandas>=1.4",
]

[project.optional-dependencies]
# Plotting (mlquantify.visualization). Kept out of the core install so that
# `import mlquantify` never pulls in matplotlib.
viz = ["matplotlib>=3.5"]
# Neural quantifiers (mlquantify.neural, e.g. QuaNet).
neural = ["torch>=1.12"]
# Everything optional.
all = ["matplotlib>=3.5", "torch>=1.12"]

[project.urls]
Homepage = "https://github.com/luizfernandolj/mlquantify"
Documentation = "https://luizfernandolj.github.io/mlquantify/"
Source = "https://github.com/luizfernandolj/mlquantify"
"Issue Tracker" = "https://github.com/luizfernandolj/mlquantify/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mlquantify*"]
